name: Tests

on:
  pull_request: null
  push:
    branches:
      - main
  # Weekly, so a new bolt-seo release (or a change on its main branch) that the
  # sitemap no longer agrees with shows up without a change here.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  COMPOSER_CACHE_DIR: /tmp/composer-cache

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]

    name: PHPUnit - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # see https://github.com/shivammathur/setup-php
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring, pdo, curl, pdo_sqlite
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}

      # No composer.lock: this resolves the newest bolt-seo 2.x release, which
      # BoltSeoContractTest checks the sitemap against.
      - run: composer install --no-progress --no-interaction

      - run: vendor/bin/phpunit --colors=always

  # bolt-seo is optional: everything must work without it (the contract test is
  # skipped).
  without-bolt-seo:
    name: PHPUnit - without bolt-seo
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: 8.4

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, curl, pdo_sqlite
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: composer remove --dev appolodev/bolt-seo --no-progress --no-interaction

      - name: bolt-seo is not installed
        run: test ! -d vendor/appolodev/bolt-seo

      - run: vendor/bin/phpunit --colors=always

  # Early warning: bolt-seo's unreleased main branch.
  bolt-seo-main:
    name: bolt-seo contract - main branch
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: 8.4

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, curl, pdo_sqlite
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: composer require --dev 'appolodev/bolt-seo:dev-main' --with-all-dependencies --no-progress --no-interaction

      - run: vendor/bin/phpunit --colors=always tests/Content/BoltSeoContractTest.php tests/Content/SeoRulesTest.php tests/Segment/SegmentUrlsTest.php

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: 8.4
      # Minimum line coverage of src/, in percent.
      MIN_COVERAGE: 95

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: json, mbstring, pdo, curl, pdo_sqlite
          coverage: pcov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.json') }}

      - run: composer install --no-progress --no-interaction

      - run: vendor/bin/phpunit --colors=always --coverage-text --coverage-clover=var/coverage.xml

      - name: Check minimum coverage
        run: |
          php -r '
            $metrics = simplexml_load_file("var/coverage.xml")->project->metrics;
            $coverage = 100 * (int) $metrics["coveredstatements"] / max(1, (int) $metrics["statements"]);
            printf("Line coverage: %.2f%% (minimum %d%%)\n", $coverage, getenv("MIN_COVERAGE"));
            exit($coverage < (float) getenv("MIN_COVERAGE") ? 1 : 0);
          '
